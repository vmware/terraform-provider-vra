---
name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  gotest:
    name: gotest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: 'go.mod'
      - name: Go Build
        run: go build -v ./.
      - name: Go Test
        run: go test ./... -timeout=30s -parallel=4
